// *********************************************************************************************************************
// Enable plugins
// *********************************************************************************************************************
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'

// *********************************************************************************************************************
// Project Properties
// *********************************************************************************************************************
// Standard project properties. These are used as default values by some assembly and release task, e.g. jar

project.description = 'java8-examples - Code examples for new language features and enhancements in Java (JSE) 8.'

// Set Java source & class versions to use when compiling. Needs to be defined after applying java plugin to take affect
project.sourceCompatibility = 1.8
project.targetCompatibility = 1.8

ext {
  // Cribbed from https://github.com/mindscratch/reactor-offline/blob/master/build.gradle
  javadocLinks = [
    "https://docs.oracle.com/javase/8/docs/api/",
    "https://junit.org/junit4/javadoc/4.11/",
    "https://hamcrest.org/JavaHamcrest/javadoc/1.3/"
  ] as String[]
}

// *********************************************************************************************************************
// Task configuration
// *********************************************************************************************************************

repositories {
  mavenCentral()
}

dependencies {
  // Compile-time dependencies  
  
  // Test dependencies
  testCompile('ch.qos.logback:logback-classic:1.1.2')
  testCompile('junit:junit:4.11')
  testCompile('org.assertj:assertj-core:3.8.0')
  testCompile('org.hamcrest:hamcrest-library:1.3')
    
  // Runtime dependencies  
}

eclipse.classpath.downloadJavadoc = true // defaults to 'false'

jar {
  baseName = 'java8-examples'
  version =  '0.0.1-SNAPSHOT'
}

// *********************************************************************************************************************
// Tasks
// *********************************************************************************************************************

tasks.register('javadocTests', Javadoc) {
  description = "Generates Javadoc API documentation for the test source code."
  group = "Documentation"
  source = sourceSets.test.allJava
  classpath = configurations.testCompile
  options.links(project.ext.javadocLinks)
}
